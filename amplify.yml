# AWS Amplify Hosting build spec (task 10, Req 17.5). Monorepo app: Amplify runs each phase
# from `appRoot`, so install from the workspace root and build only the web package.
# VITE_API_BASE_URL and VITE_APP_ENV are set per branch in the Amplify console, and the SPA
# rewrite rule lives in the console too (Rewrites and redirects). See docs/amplify-hosting.md.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - corepack enable
            # Version comes from the root `packageManager` field (pnpm@10.34.5).
            - corepack prepare pnpm@10.34.5 --activate
            # Phases run from appRoot (apps/web); the workspace root is two levels up.
            # (CODEBUILD_SRC_DIR is the parent of the cloned repo folder, so don't use it.)
            - pnpm -C ../.. install --frozen-lockfile --store-dir "$PWD/.pnpm-store"
        build:
          commands:
            - pnpm -C ../.. --filter @proof-and-poise/web build
      artifacts:
        # Vite's default outDir, relative to appRoot.
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .pnpm-store/**/*
